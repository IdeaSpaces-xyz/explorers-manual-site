<svg class="scene" viewBox="0 0 720 620" role="img" aria-labelledby="sT sD">
          <title id="sT">An agent loop, and the folder it learns to work with</title>
          <desc id="sD">A diagram that changes as you scroll. An agent loop cycles between the model,
          its actions and their results, reading a context block each pass. A code repository is shown
          as something the loop already works with because it has a
          shape; unstructured knowledge is shown as something it cannot. The knowledge then takes on
          the same shape, splitting into a knowledge layer and a point-of-view layer under git, which
          the loop reads from and writes to — and which any harness can read.</desc>

          <defs>
            <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
                    orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="flowhead"/></marker>
            <marker id="ahOn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
                    orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="flowhead on"/></marker>
          </defs>

          <!-- loop boundary: wide in act I, tight from act III -->
          <rect class="dash-box grp" id="boxWide" x="64" y="36" width="592" height="404" rx="10"/>
          <rect class="dash-box grp" id="boxTight" x="196" y="36" width="328" height="176" rx="10" opacity="0"/>

          <!-- the loop itself: never moves -->
          <g class="node" id="n-model">
            <rect class="node-box" x="290" y="56" width="140" height="34" rx="4"/>
            <text class="s-node" x="360" y="79" text-anchor="middle">model</text>
          </g>
          <g class="node" id="n-act">
            <rect class="node-box" x="212" y="150" width="124" height="34" rx="4"/>
            <text class="s-node" x="274" y="173" text-anchor="middle">acts</text>
          </g>
          <g class="node" id="n-result">
            <rect class="node-box" x="384" y="150" width="124" height="34" rx="4"/>
            <text class="s-node" x="446" y="173" text-anchor="middle">result</text>
          </g>

          <path id="f-ma" class="flow" marker-end="url(#ah)" d="M 306 93 C 284 110, 272 124, 272 142"/>
          <path id="f-ar" class="flow" marker-end="url(#ah)" d="M 342 167 L 376 167"/>
          <path id="f-rm" class="flow" marker-end="url(#ah)" d="M 448 142 C 448 124, 436 110, 414 93"/>

          <!-- ACT I: context held inside the loop -->
          <g class="grp" id="gCtx">
            <path id="f-read" class="flow" marker-end="url(#ah)" d="M 300 252 L 300 194"/>
            <text class="s-arrow" x="292" y="228" text-anchor="end">reads all</text>
            <path id="f-back" class="flow" marker-end="url(#ah)" d="M 420 194 L 420 252"/>
            <text class="s-arrow" x="428" y="228">appends</text>

            <rect class="panel" x="140" y="258" width="440" height="150"/>
            <text class="s-head" x="156" y="280">context</text>
            <rect class="bar" x="156" y="292" width="408" height="18"/>
            <rect class="bar" x="156" y="316" width="408" height="18"/>
            <rect class="bar" x="156" y="340" width="408" height="18"/>
            <rect class="bar" x="156" y="364" width="408" height="18"/>
          </g>

          <!-- ACT II: code has a shape, knowledge doesn't -->
          <g class="grp" id="gCompare" opacity="0">
            <path id="f-repo" class="flow" marker-end="url(#ah)" d="M 200 252 L 200 194"/>
            <path class="flow" marker-end="url(#ah)" d="M 236 194 L 236 252"/>

            <rect class="panel" x="100" y="258" width="240" height="176"/>
            <text class="s-head" x="116" y="282">code — has a shape</text>
            <text class="s-item" x="116" y="312">src/</text>
            <text class="s-item" x="132" y="336">loop.ts</text>
            <text class="s-item" x="132" y="360">tools.ts</text>
            <text class="s-item" x="116" y="384">test/</text>
            <text class="s-item" x="116" y="412">README.md</text>

            <rect class="panel loose" x="380" y="258" width="240" height="176"/>
            <text class="s-head" x="396" y="282" style="fill:var(--is-purpose)">knowledge — a thousand shapes</text>
            <rect class="scatter" x="400" y="300" width="86" height="16"/>
            <rect class="scatter" x="512" y="312" width="62" height="16"/>
            <rect class="scatter" x="418" y="336" width="112" height="16"/>
            <rect class="scatter" x="396" y="368" width="54" height="16"/>
            <rect class="scatter" x="486" y="360" width="98" height="16"/>
            <rect class="scatter" x="440" y="394" width="74" height="16"/>
            <text class="s-nocap" x="500" y="452" text-anchor="middle">nothing to navigate by</text>
          </g>

          <!-- ACT III+: the shaped space -->
          <g class="grp" id="gSpace" opacity="0">
            <path id="f-in" class="flow" marker-end="url(#ah)" d="M 220 246 L 220 220"/>
            <text class="s-arrow" x="212" y="238" text-anchor="end">reads</text>
            <path id="f-out" class="flow" marker-end="url(#ah)" d="M 500 220 L 500 246"/>
            <text class="s-arrow" x="508" y="238">writes</text>

            <text class="s-crumb" id="crumb" x="100" y="268">~/space/</text>

            <rect class="panel" x="100" y="280" width="500" height="176" rx="5"/>

            <g class="grp" id="knLayer">
              <rect class="panel" x="116" y="308" width="226" height="132"/>
              <text class="s-head" x="130" y="330">knowledge</text>
              <rect class="bar" x="130" y="342" width="198" height="20"/>
              <rect class="bar" x="130" y="368" width="198" height="20"/>
              <rect class="bar" x="130" y="394" width="198" height="20"/>
              <text class="s-item" x="138" y="357">decisions.md</text>
              <text class="s-item" x="138" y="383">findings.md</text>
              <text class="s-item" x="138" y="409">open-questions.md</text>
            </g>

            <rect class="panel pov" x="358" y="308" width="226" height="132"/>
            <text class="s-head" x="372" y="330" style="fill:var(--is-accent)">point of view</text>
            <rect class="bar pov" x="372" y="342" width="198" height="20"/>
            <rect class="bar pov" x="372" y="368" width="198" height="20"/>
            <rect class="bar pov" x="372" y="394" width="198" height="20"/>
            <text class="s-item" id="pov1" x="380" y="357" style="fill:var(--is-accent-text)">foundation.md</text>
            <text class="s-item" id="pov2" x="380" y="383" style="fill:var(--is-accent-text)">guide.md</text>
            <text class="s-item" id="pov3" x="380" y="409" style="fill:var(--is-accent-text)">now.md</text>

            <line class="gitrail" x1="116" y1="484" x2="584" y2="484"/>
            <circle class="gitdot" cx="140" cy="484" r="3.5"/>
            <circle class="gitdot" cx="228" cy="484" r="3.5"/>
            <circle class="gitdot" cx="316" cy="484" r="3.5"/>
            <circle class="gitdot" cx="404" cy="484" r="3.5"/>
            <circle class="gitdot on" cx="492" cy="484" r="4.5"/>
            <text class="s-head" x="584" y="506" text-anchor="end">git history</text>
          </g>

          <!-- ACT IV extras -->
          <g class="grp" id="gFork" opacity="0">
            <path class="flow on" marker-end="url(#ahOn)" d="M 606 368 L 648 368"/>
            <rect class="panel" x="654" y="308" width="56" height="132" rx="4"/>
            <rect class="bar" x="662" y="320" width="40" height="44"/>
            <rect class="bar pov" x="662" y="376" width="40" height="44"/>
            <text class="s-arrow" x="682" y="296" text-anchor="middle" style="fill:var(--is-accent)">fork</text>
          </g>

          <!-- ACT IV: the real topology — many agents, many spaces, one harness -->
          <g class="grp" id="gMesh" opacity="0">
            <text class="s-head" x="36" y="284">agents</text>
            <text class="s-head" x="684" y="284" text-anchor="end">spaces</text>

            <path class="flow faint" d="M 204 317 C 270 317, 300 280, 336 222"/>
            <path class="flow on"    d="M 204 361 C 270 361, 300 290, 338 226" marker-end="url(#ahOn)"/>
            <path class="flow faint" d="M 204 405 C 275 405, 305 300, 340 230"/>
            <path class="flow faint" d="M 204 449 C 280 449, 310 310, 342 234"/>

            <path class="flow on"    d="M 516 317 C 450 317, 420 280, 382 222" marker-end="url(#ahOn)"/>
            <path class="flow faint" d="M 516 361 C 450 361, 420 290, 384 226"/>
            <path class="flow faint" d="M 516 405 C 445 405, 415 300, 386 230"/>
            <path class="flow faint" d="M 516 449 C 440 449, 410 310, 388 234"/>

            <g opacity=".45">
              <rect class="panel pov" x="36" y="300" width="168" height="34"/>
              <rect class="panel pov" x="36" y="388" width="168" height="34"/>
              <rect class="panel pov" x="36" y="432" width="168" height="34"/>
            </g>
            <rect class="panel pov" x="36" y="344" width="168" height="34" style="stroke:var(--is-accent); stroke-width:2"/>
            <text class="s-small" x="48" y="321" opacity=".45">executive-assistant/</text>
            <text class="s-small" x="48" y="365" style="fill:var(--is-accent-text)">backend/</text>
            <text class="s-small" x="48" y="409" opacity=".45">gtm/</text>
            <text class="s-small" x="48" y="453" opacity=".45">visuals/</text>

            <g opacity=".45">
              <rect class="panel" x="516" y="344" width="168" height="34"/>
              <rect class="panel" x="516" y="388" width="168" height="34"/>
              <rect class="panel" x="516" y="432" width="168" height="34"/>
            </g>
            <rect class="panel" x="516" y="300" width="168" height="34" style="stroke:var(--is-text); stroke-width:2"/>
            <text class="s-small" x="528" y="321" style="fill:var(--is-text)">roadmap/</text>
            <text class="s-small" x="528" y="365" opacity=".45">product-docs/</text>
            <text class="s-small" x="528" y="409" opacity=".45">company/</text>
            <text class="s-small" x="528" y="453" opacity=".45">the-code-repo/</text>

            <text class="s-arrow" x="360" y="524" text-anchor="middle">one session = one agent × one space</text>
            <text class="s-head" x="360" y="548" text-anchor="middle">assembled in the harness you already run</text>
          </g>

        </svg>
